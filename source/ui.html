<!-- Replace the original UI DOM (after canvas, before game script), keep this CSS after all old CSS. -->
<style id="studio-ui-style">
:root{--paper:#f6f2e8;--ink:#242321;--ink-soft:#68675f;--vermillion:#a54e3b;--rule:#bdb9ab;--serif:"Songti SC","STSong","Noto Serif CJK SC","SimSun",serif}
body{background:var(--paper);font-family:var(--serif);color:var(--ink)}
#labBar,#labHelp,#demo,#controlBar{display:none!important}
#touchZones{inset:0 0 max(116px,calc(102px + env(safe-area-inset-bottom))) 0}
#touchZones .zone:after{top:auto;bottom:22%;width:3px;height:48px;background:var(--vermillion);opacity:0;transition:opacity .14s;transform:rotate(-7deg)}
#touchZones #zoneL:after{left:8px}#touchZones #zoneR:after{right:8px;transform:rotate(7deg)}#touchZones .zone.active:after{opacity:.45}
#statusDock{height:90px;background:var(--paper);border:0;box-shadow:none;color:var(--ink);padding:5px max(20px,calc((100vw - 520px)/2)) 8px;pointer-events:none}
#statusDock:before{content:"";position:absolute;left:5%;right:5%;top:0;height:1px;background:var(--rule);opacity:.5}
#dockRow{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:44px}
.studio-score{display:flex;align-items:baseline;gap:9px}#dockKills{font:600 43px/1 Georgia,"Songti SC",serif;letter-spacing:-1px;font-variant-numeric:tabular-nums}.studio-kill-unit{font-size:17px;color:var(--ink-soft)}
.studio-life-wrap{text-align:right}.studio-caption{font-size:13px;letter-spacing:.12em;color:var(--ink-soft)}#studioLives{display:flex;gap:7px;justify-content:flex-end;margin-top:4px}.studio-life{display:inline-flex;width:21px;height:21px;align-items:center;justify-content:center;background:var(--vermillion);border:1px solid var(--vermillion);color:var(--paper);font-size:14px;line-height:1;transform:rotate(-3deg);border-radius:1px 2px 0 1px}.studio-life:nth-child(2){transform:rotate(2deg)}.studio-life.lost{color:transparent;background:none;border-color:var(--rule);opacity:.55}
#dockMeta{display:none}#dockMeter{position:relative;height:5px;border:0;border-radius:0;margin:6px 0 4px;background:#dedbd0;overflow:visible}#dockFill{background:var(--ink);height:5px;border-radius:0;transition:width .12s;clip-path:polygon(0 12%,99% 0,100% 46%,98% 90%,2% 100%,0 70%)}
.studio-meter-tick{position:absolute;top:-2px;width:1px;height:9px;background:var(--paper)}.studio-meter-tick:nth-of-type(2){left:25%}.studio-meter-tick:nth-of-type(3){left:58.333%}
#dockCaption{display:flex;justify-content:space-between;color:var(--ink-soft);font-size:13px;line-height:1.2;margin:0;letter-spacing:.06em}#dockProgress{font-variant-numeric:tabular-nums}.studio-tier{color:var(--ink);margin-left:7px}
#dockReady{position:static;display:none;transform:none;white-space:nowrap;font-size:15px;line-height:1.1;color:var(--vermillion);text-shadow:none;font-weight:600;letter-spacing:.12em;animation:none;margin-left:auto;margin-right:4px}#statusDock.ready #dockFill{background:var(--vermillion)}
#titleScreen{padding:calc(8vh + env(safe-area-inset-top)) 18px calc(13vh + env(safe-area-inset-bottom));font-family:var(--serif)}#titleScreen h1{font-family:var(--serif);font-size:clamp(36px,11.5vw,58px);font-weight:700;letter-spacing:.13em;color:var(--ink);text-shadow:none;margin-left:.13em}#titleScreen p{font-size:15px;color:var(--ink-soft);letter-spacing:.5em;text-align:center;margin:11px 0 0 .5em}.studio-title-seal{display:inline-flex;align-items:center;justify-content:center;width:26px;height:27px;border:1px solid var(--vermillion);color:var(--vermillion);font-size:15px;transform:rotate(3deg);letter-spacing:0;vertical-align:middle;margin-left:6px}.studio-start-wrap{text-align:center}#startGame,#studioRetry{font-family:var(--serif);font-size:20px;letter-spacing:.18em;font-weight:600;color:var(--paper);background:var(--ink);border:0;border-radius:2px 0 2px 0;padding:13px 34px;min-height:48px;min-width:148px;box-shadow:none;touch-action:manipulation;pointer-events:auto}#startGame:active,#studioRetry:active{background:var(--vermillion)}#startGame:focus-visible,#studioRetry:focus-visible{outline:2px solid var(--vermillion);outline-offset:5px}.studio-input-note{font:13px/1.7 var(--serif);color:var(--ink-soft);margin-top:12px;letter-spacing:.06em;background:rgba(246,242,232,.96);padding:4px 7px}
#introLabel{top:20%;font-family:var(--serif);font-size:24px;color:var(--vermillion);font-weight:600;text-shadow:none;animation:none;line-height:1.7}#introLabel small{font-size:14px;color:var(--ink);font-weight:400;letter-spacing:.08em}
#studioRankToast{position:fixed;top:max(30px,env(safe-area-inset-top));left:50%;transform:translate(-50%,-5px);opacity:0;z-index:8;pointer-events:none;background:rgba(246,242,232,.94);padding:8px 16px;color:var(--ink);font:17px var(--serif);letter-spacing:.15em;white-space:nowrap;transition:opacity .25s,transform .25s}#studioRankToast.visible{opacity:1;transform:translate(-50%,0)}#studioRankToast:before{content:"印";display:inline-block;font-size:11px;line-height:20px;width:20px;text-align:center;margin-right:9px;border:1px solid var(--vermillion);color:var(--vermillion);letter-spacing:0;vertical-align:1px}
#studioResult{position:fixed;inset:0 0 max(116px,calc(102px + env(safe-area-inset-bottom))) 0;z-index:10;display:flex;flex-direction:column;justify-content:center;align-items:center;background:rgba(246,242,232,.94);pointer-events:none;text-align:center;padding:24px}#studioResult[hidden]{display:none}.studio-result-caption{font:13px var(--serif);letter-spacing:.35em;color:var(--ink-soft);margin:0 0 18px}.studio-result-rank{font:600 clamp(28px,9vw,42px)/1.4 var(--serif);letter-spacing:.15em;margin:0 0 13px}.studio-result-score{font:54px/1.15 Georgia,serif;margin:0}.studio-result-score small{font:17px var(--serif);margin-left:8px;color:var(--ink-soft)}#studioResultNext{font:13px/1.7 var(--serif);color:var(--ink-soft);margin:19px 0 26px}#studioRetry{font-size:17px;padding:12px 25px}#studioResult .studio-title-seal{margin:18px 0 0}
@media(max-width:350px){#statusDock{padding-left:15px;padding-right:15px}#dockKills{font-size:38px}#dockReady{font-size:13px;letter-spacing:.05em}#dockRow{gap:10px}.studio-life{width:21px;height:21px}#studioLives{gap:5px}.studio-input-note{font-size:13px}#titleScreen h1{font-size:36px}}
@media(max-height:580px){#titleScreen{padding-top:4vh;padding-bottom:5vh}#titleScreen h1{font-size:32px}.studio-input-note{margin-top:7px}#introLabel{top:13%}}
@media(prefers-reduced-motion:reduce){#dockFill,#studioRankToast,#touchZones .zone:after{transition:none}#introLabel,#dockReady{animation:none}}
</style>
<div id="touchZones"><div class="zone" id="zoneL" aria-label="左侧轻功"></div><div class="zone" id="zoneR" aria-label="右侧轻功"></div></div>
<div id="statusDock" role="group" aria-label="战况">
  <div id="dockRow"><div class="studio-score"><span id="dockKills">0</span><span class="studio-kill-unit" data-ui-text="killUnit"></span></div><div id="dockReady" data-ui-text="ultimate"></div><div class="studio-life-wrap"><span class="studio-caption" data-ui-text="life"></span><div id="studioLives" aria-label="生命 3 / 3"><span class="studio-life" aria-hidden="true">命</span><span class="studio-life" aria-hidden="true">命</span><span class="studio-life" aria-hidden="true">命</span></div></div></div>
  <div id="dockMeta" aria-hidden="true"></div><div id="dockMeter"><div id="dockFill"></div><i class="studio-meter-tick"></i><i class="studio-meter-tick"></i></div><div id="dockCaption"><span><span data-ui-text="charge"></span><span id="studioTier" class="studio-tier"></span></span><span id="dockProgress"></span></div>
</div>
<div id="titleScreen"><div><h1 data-ui-text="title"></h1><p><span data-ui-text="subtitle"></span><span class="studio-title-seal" data-ui-text="inkSeal"></span></p></div><div class="studio-start-wrap"><button id="startGame" data-ui-text="start"></button><div class="studio-input-note" data-ui-text="touchHint"></div></div></div>
<div id="introLabel"><span data-ui-text="ultimate"></span><br><small data-ui-text="tutorial"></small></div>
<div id="studioRankToast" role="status" aria-live="polite"></div>
<section id="studioResult" hidden aria-labelledby="studioResultRank"><p class="studio-result-caption" data-ui-text="resultCaption"></p><h2 id="studioResultRank" class="studio-result-rank"></h2><p class="studio-result-score"><span id="studioResultKills"></span><small data-ui-text="killUnit"></small></p><p id="studioResultNext"></p><button id="studioRetry" data-ui-text="retry"></button><span class="studio-title-seal" data-ui-text="inkSeal"></span></section>
<!-- Original game listeners require these compatibility IDs. They are never shown. -->
<button id="demo" hidden></button><div class="ui" id="controlBar" aria-hidden="true"><button id="left"></button><div id="ultHint"></div><button id="right"></button></div>
